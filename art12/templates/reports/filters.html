<form id="filterform" class="form box box-small inline-block" name="filterform"
      method="get">

  <div class="box-col width-180">
    <label>{{ filter_form.period.label }}</label>
    {{ filter_form.period(
      class="select2-period",
      **{'data-href': url_for('.filter_form'),
        'data-href-countries': url_for('.filter_form_countries')})
    }}
  </div>

  <div class="box-col width-240">
    <label>{{ filter_form.country.label }}</label>
    {{ filter_form.country(
      class="select2-country",
      **{'data-href': country_url}
      )
    }}
  </div>

  <button type="submit" class="btn-blue btn-xl offset_top_label">Filter</button>

</form>

<script>
  $(document).ready(function() {
    $('.select2-period').select2({
      placeholder: 'Search period...',
      allowClear: true,
      width: '100%'
    });

    $('.select2-country').select2({
      placeholder: 'Search country...',
      allowClear: true,
      width: '100%'
    });
  });
</script>
