name: Tests

on:
  push:
    branches: [master, production]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        # keep in sync with the db image in docker-compose.yml
        image: postgres:13
        env:
          POSTGRES_USER: art12
          POSTGRES_PASSWORD: art12
          POSTGRES_DB: art12test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U art12"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # read by testsuite/conftest.py
      DB_USER_TEST: art12
      DB_PASSWORD_TEST: art12
      DB_HOST_TEST: localhost
      DB_NAME_TEST: art12test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libldap2-dev libsasl2-dev

      - name: Install requirements
        run: |
          pip install setuptools==84.2.1
          pip install -r requirements-dev.txt

      - name: Run tests
        run: >
          python -m pytest testsuite
          --cov=art12 --cov=eea_integration
          --cov-report=term --cov-report=xml --cov-report=html

      - name: Coverage summary
        if: success() || failure()
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          if-no-files-found: ignore
